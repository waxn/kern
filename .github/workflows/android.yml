name: Android

on:
  push:
    branches: [main]
    tags: ["android-v*"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write # only used to attach the APK to a release on android-v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testKernDebugUnitTest testMailDebugUnitTest

      - name: Build APKs
        env:
          KERN_KEYSTORE_B64: ${{ secrets.KERN_KEYSTORE_B64 }}
          KERN_KEYSTORE_PASSWORD: ${{ secrets.KERN_KEYSTORE_PASSWORD }}
          KERN_KEY_ALIAS: ${{ secrets.KERN_KEY_ALIAS }}
          KERN_KEY_PASSWORD: ${{ secrets.KERN_KEY_PASSWORD }}
        run: |
          # The permanent release key (see android/README.md). Absent on forks: debug key then.
          if [ -n "$KERN_KEYSTORE_B64" ]; then
            echo "$KERN_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kern-release.jks"
            export KERN_KEYSTORE_FILE="$RUNNER_TEMP/kern-release.jks"
          else
            echo "::warning::No KERN_KEYSTORE_B64 secret; release APKs use the debug key and cannot update installed apps."
          fi
          ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Name the APKs
        run: |
          ver="${GITHUB_REF_NAME#android-v}"
          [ "$GITHUB_REF_TYPE" = tag ] || ver="${GITHUB_SHA::7}"
          mkdir -p dist
          cp app/build/outputs/apk/kern/release/app-kern-release.apk "dist/kern-$ver.apk"
          cp app/build/outputs/apk/kern/debug/app-kern-debug.apk "dist/kern-$ver-debug.apk"
          cp app/build/outputs/apk/mail/release/app-mail-release.apk "dist/kern-mail-$ver.apk"
          cp app/build/outputs/apk/mail/debug/app-mail-debug.apk "dist/kern-mail-$ver-debug.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: kern-android
          path: android/dist/*.apk
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/android-v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/dist/*.apk
