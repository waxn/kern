# Kern — personal knowledge base.
#   docker compose up -d --build     then open http://<this machine>:8420 and finish setup.
#   The setup code is in the log:    docker compose logs backend
name: kern

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      KERN_DATA_DIR: /data
      # Set KERN_HTTPS=1 when Kern is served over HTTPS by a proxy in front of it.
      KERN_HTTPS: ${KERN_HTTPS:-0}
      KERN_TRUSTED_HOSTS: ${KERN_TRUSTED_HOSTS:-}
    volumes:
      - kern_data:/data
    extra_hosts:
      # Lets the AI assistant reach a local model server (e.g. Ollama) on this machine.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # The first visit shows the setup wizard. Change the port or restrict the address in .env.
      - "${KERN_BIND:-0.0.0.0}:${KERN_PORT:-8420}:80"

volumes:
  # SQLite database and uploaded files. Survives rebuilds and `docker compose down`.
  kern_data:
