# Kern — personal knowledge base.
#   docker compose up -d --build     then open http://<this machine>:8420 and finish setup.
#   The setup code is in the log:    docker compose logs backend
name: kern

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      KERN_DATA_DIR: /data
      # Set KERN_HTTPS=1 when Kern is served over HTTPS by a proxy in front of it.
      KERN_HTTPS: ${KERN_HTTPS:-0}
      KERN_TRUSTED_HOSTS: ${KERN_TRUSTED_HOSTS:-}
    volumes:
      - kern_data:/data
    extra_hosts:
      # Lets the AI assistant reach a local model server (e.g. Ollama) on this machine.
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

  # Keeps every connected mailbox in sync (Settings → Mail): IMAP IDLE for new mail,
  # periodic folder checks, and sending. Same image as the backend, its own process.
  mail:
    build: ./backend
    command: ["mail-worker"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      KERN_DATA_DIR: /data
    volumes:
      - kern_data:/data
    extra_hosts:
      # Lets a test mail server on this machine be reached as host.docker.internal
      # (also needs Settings → Server → "Mail servers on the local network").
      - "host.docker.internal:host-gateway"

  # Runs the CI pipelines of the git server (.kern/ci.yml, see docs/git-ci.md). Each job runs in a
  # sibling container started through the host's Docker socket, so mounting it gives this service
  # (and the code you run in your pipelines) control of Docker on the host: only for your own repos.
  # Don't need CI? Remove this service.
  ci:
    build: ./backend
    command: ["ci-worker"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      KERN_DATA_DIR: /data
      KERN_CI_RUNNER: docker
      # KERN_CI_CONCURRENCY: 1          # runs at the same time
      # KERN_CI_DEFAULT_TIMEOUT_MIN: 30 # per job unless the pipeline says otherwise
      # KERN_CI_MAX_TIMEOUT_MIN: 360    # upper limit for any timeout
      # KERN_CI_KEEP_RUNS: 50           # runs (with logs and artifacts) kept per repository
    volumes:
      - kern_data:/data
      - /var/run/docker.sock:/var/run/docker.sock

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # The first visit shows the setup wizard. Change the port or restrict the address in .env.
      - "${KERN_BIND:-0.0.0.0}:${KERN_PORT:-8420}:80"

volumes:
  # SQLite database and uploaded files. Survives rebuilds and `docker compose down`.
  kern_data:
